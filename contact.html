<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Salim Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>SALIM AL MAALAM</h1>
      <p>Web Developer & Designer</p>
      <nav>
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>
    <section>
      <h2>Contact</h2>
      <p>Email: <a href="mailto:salim@email.com">salim@email.com</a></p>
      <p>LinkedIn: <a href="#" target="_blank">linkedin.com/in/salim</a></p>
      <form style="margin-top: 2rem; max-width: 400px">
        <label for="name">Name</label><br />
        <input
          type="text"
          id="name"
          name="name"
          style="width: 100%; padding: 8px; margin-bottom: 1rem"
          required
        /><br />
        <label for="email">Email</label><br />
        <input
          type="email"
          id="email"
          name="email"
          style="width: 100%; padding: 8px; margin-bottom: 1rem"
          required
        /><br />
        <label for="message">Message</label><br />
        <textarea
          id="message"
          name="message"
          rows="4"
          style="width: 100%; padding: 8px; margin-bottom: 1rem"
          required
        ></textarea
        ><br />
        <button
          type="submit"
          style="
            background: #222;
            color: #fff;
            padding: 0.7rem 2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
          "
        >
          Send
        </button>
      </form>
    </section>
    <footer>&copy; 2025 Salim. All rights reserved.</footer>
  </body>
</html>
